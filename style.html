<style>
:root{--ink:#243044;--muted:#536176;--blue:#285bc0;--line:#e0e6ef}
.stApp{background:#fff;color:var(--ink)}
.stApp h1,.stApp h2,.stApp h3,.stApp p,.stApp input,.stApp textarea,.stApp label,.stApp button{font-family:Arial,Helvetica,sans-serif}
.block-container{max-width:1380px;padding:4rem 2.5rem 3rem}
[data-testid="stHeader"]{background:#ffffffee}[data-testid="stAppDeployButton"]{display:none!important}
[data-testid="stSidebar"]{background:#f7f9fc;border-right:1px solid var(--line);min-width:245px;max-width:265px}
.brand{font:600 22px Arial;color:var(--blue);padding:10px 0 16px}.brand span{font-size:18px;color:var(--ink)}.workspace{font:11px Arial!important;letter-spacing:1px;color:#5e6b7e;margin-bottom:16px}
.chapter-nav{display:flex;flex-direction:column;gap:2px}.chapter-nav a{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-left:2px solid transparent;text-decoration:none!important;color:#536176;font:14px Arial}.chapter-nav a.active{color:#214c9c;background:#eaf0fc;border-left-color:#2d63ca}.chapter-nav a:hover{background:#eff3f9}.nav-count{background:#dee8fb;color:#274d93;border-radius:10px;padding:2px 7px;font-size:11px}
a:focus-visible,button:focus-visible{outline:3px solid #608fe5!important;outline-offset:3px}
[data-testid="stElementContainer"]:has(> [data-testid="stMarkdown"] .data-chip){position:sticky;top:3.2rem;z-index:90;background:white}
.data-chip{position:relative;z-index:90;background:#f7f9ff;border:1px solid #dce5f5;border-radius:6px;padding:9px 12px;font:600 11px Arial;color:#35558c;display:flex;justify-content:space-between;gap:8px;margin-bottom:20px}.data-chip span{font-weight:400;color:#536176}
.chapter-heading{scroll-margin-top:105px;border-top:1px solid var(--line);padding:28px 0 12px;margin-top:40px}.chapter-heading.hero{border:0;padding:8px 0;margin:0}.eyebrow{font:600 11px Arial;color:#536176;letter-spacing:.7px;margin-bottom:12px}.chapter-heading h1{font-size:clamp(32px,3.6vw,48px)!important;font-weight:500!important;line-height:1.13;letter-spacing:-1.5px;margin:0 0 16px!important}.chapter-heading h1 span,.chapter-heading h2 span{color:#647287}.chapter-heading h2{font-size:clamp(24px,2.4vw,30px)!important;font-weight:500!important;letter-spacing:-.7px;margin:0 0 10px!important}.chapter-heading p{font-size:15px;line-height:1.6;color:#536176;max-width:850px;margin:0}
.stApp h3{font-size:18px!important;font-weight:600!important;letter-spacing:-.2px}.stApp [data-testid="stMarkdownContainer"] p{font-size:15px;line-height:1.6}.stApp [data-testid="stCaptionContainer"] p{font-size:12px;color:#536176;line-height:1.6}.pitch{font-size:14px!important;color:#536176;border-left:2px solid #bdd0f1;padding-left:14px;max-width:850px;margin:12px 0 20px}
.section-link{display:inline-block;background:#285bc0;border:1px solid #285bc0;color:white!important;border-radius:6px;text-decoration:none!important;padding:10px 14px;font:14px Arial;margin:10px 0}.section-link:hover{background:#214d9c}
.stButton button,.stDownloadButton button{border-radius:6px;font-size:14px;min-height:38px;border-color:#cbd6e6}
[data-testid="stMetric"]{border:1px solid var(--line);border-radius:8px;padding:15px;margin:0 0 10px;background:white}[data-testid="stMetricValue"]{font-size:28px;font-weight:500}[data-testid="stMetricLabel"] p{font-size:13px!important;white-space:normal}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 18px}.funnel>div{padding:14px 10px;border:1px solid var(--line);border-radius:7px}.funnel span{font-size:12px;color:#536176}.funnel b{display:block;font-size:25px;font-weight:500;margin:9px 0}.funnel small{font-size:11px;line-height:1.5;color:#536176;display:block;min-height:34px}.bar{height:7px;background:#e9eef6;border-radius:4px;overflow:hidden;margin:10px 0}.bar i{height:100%;display:block;background:#3d6ece;border-radius:4px}
.table-scroll{overflow:auto;margin:18px 0}.heatmap{width:100%;border-collapse:collapse;font:13px Arial}.heatmap caption{text-align:left;color:#536176;padding:10px 0}.heatmap th,.heatmap td{padding:12px;border:1px solid var(--line);text-align:left;white-space:nowrap}.heatmap thead{background:#f7f9fc}.heatmap th{font-weight:500}.channel-dot{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:7px}
.channel-card{border:1px solid var(--line);border-radius:8px;padding:16px;margin:0 0 16px}.channel-card>b{display:block;font-size:14px;font-weight:600;padding-left:9px;margin-bottom:16px}.channel-rate{font-size:12px;margin:12px 0}.channel-rate strong{float:right;font-weight:400;color:#536176}.channel-rate .bar{clear:both}
.record-title{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px;font-size:16px}.record-title span{color:#536176;font-size:12px}.timeline{list-style:none;display:flex;gap:0;margin:18px 0;padding:0}.timeline li{flex:1;min-width:0;position:relative;border-top:2px solid #3f75d9;padding:12px 5px 5px}.timeline li:before{content:'';position:absolute;top:-5px;left:5px;width:8px;height:8px;border-radius:50%;background:#3f75d9}.timeline li.pending{border-top:2px dashed #b07719}.timeline li.pending:before{background:#b07719}.timeline b,.timeline span,.timeline em{display:block;font-size:11px;line-height:1.6;overflow-wrap:anywhere}.timeline b{font-weight:600}.timeline span,.timeline em{color:#536176;font-style:normal}
[data-testid="stDataFrame"]{border:1px solid var(--line);border-radius:7px}.capacity-bars{font-size:12px;color:#536176}.capacity-bars .bar{height:10px}.results-marker{height:0}.st-key-queue_table{max-height:430px}
.draft-preview{background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:20px;min-height:320px;overflow-wrap:anywhere}.draft-preview>b{font-size:16px}.draft-preview p{font-size:14px!important;line-height:1.65}
.integration{font:14px Arial;color:#35465f;background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:20px;line-height:2}.integration span{padding:0 10px;color:#2d63ca}footer{border-top:1px solid var(--line);margin-top:30px;padding-top:24px;font:14px Arial}footer p{margin:8px 0}footer a{color:#285bc0}footer span{display:block;color:#536176;font-size:12px;margin-top:12px}
@media(max-width:1100px) and (min-width:701px){.block-container{padding-left:1.5rem;padding-right:1.5rem}.funnel{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.block-container{padding:3.5rem 1rem 2rem}.data-chip{font-size:10px;top:3rem}.chapter-heading{margin-top:30px;padding-top:24px}.chapter-heading h1{font-size:34px!important}.funnel{grid-template-columns:repeat(2,1fr);gap:8px}.heatmap th,.heatmap td{padding:9px;font-size:12px}.timeline b,.timeline span,.timeline em{font-size:10px}.channel-rate strong{float:none;display:block;margin-top:4px}.integration span{padding:0 4px}.draft-preview{min-height:240px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
